name: release-image

on:
  push:
    tags:
      - "v*"
      - "V*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      build_date: ${{ steps.vars.outputs.build_date }}
      image_repo: ${{ steps.vars.outputs.image_repo }}
      release_name: ${{ steps.vars.outputs.release_name }}
      image_tar_name: ${{ steps.vars.outputs.image_tar_name }}
    steps:
      - name: Prepare image variables
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BUILD_DATE="$(date -u +%Y%m%d)"
          IMAGE_REPO="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          RELEASE_NAME="Muze ${VERSION} (${BUILD_DATE})"
          IMAGE_TAR_NAME="muze-${VERSION}-${BUILD_DATE}-linux-amd64.tar.gz"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=${IMAGE_REPO}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image_tar_name=${IMAGE_TAR_NAME}" >> "${GITHUB_OUTPUT}"

  docker:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (PAT fallback)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image_repo }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build_date }}

      - name: Build and push image
        id: ghcr_push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            VCS_REF=${{ github.sha }}

      - name: Warn when GHCR push fails
        if: steps.ghcr_push.outcome == 'failure'
        run: |
          echo "::warning::GHCR push failed (likely package permission). Release tar.gz artifact will still be published."

      - name: Build image tarball (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: muze:release-${{ needs.prepare.outputs.version }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            VCS_REF=${{ github.sha }}

      - name: Export docker image tar.gz
        run: |
          TAR_NAME="${{ needs.prepare.outputs.image_tar_name }}"
          IMAGE_TAG="muze:release-${{ needs.prepare.outputs.version }}"
          docker save "${IMAGE_TAG}" | gzip -c > "${TAR_NAME}"
          sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256"

      - name: Upload image archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tarball
          path: |
            ${{ needs.prepare.outputs.image_tar_name }}
            ${{ needs.prepare.outputs.image_tar_name }}.sha256
          if-no-files-found: error

  release-asset:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - docker
    permissions:
      contents: write
    steps:
      - name: Download image archive artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-tarball
          path: .

      - name: Publish release with docker archive
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          generate_release_notes: true
          files: |
            ${{ needs.prepare.outputs.image_tar_name }}
            ${{ needs.prepare.outputs.image_tar_name }}.sha256
          body: |
            Docker image (GHCR):
            - `${{ needs.prepare.outputs.image_repo }}:${{ needs.prepare.outputs.version }}`
            - `${{ needs.prepare.outputs.image_repo }}:${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build_date }}`

            Docker archive (Release asset):
            - `${{ needs.prepare.outputs.image_tar_name }}`

            Load command:
            - `docker load -i ${{ needs.prepare.outputs.image_tar_name }}`
